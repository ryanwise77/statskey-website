<style>

  {id:"cassette",name:"Disposable flow-cell cassette",type:"custom disposable",exact:"Custom CNC/SLA prototype; future injection-molded COC/COP or medical PC",dims:"120 x 44 x 14 mm modeled cassette body; 3.0 mm main channel; 0.7 mL active cell volume",detail:"Closed single-patient cartridge carrying the sample channel, electrode bay, pressure diaphragms, calibration loop, and optical bubble window.",risk:"Must prove no leaks, no stagnant blood pockets, no unsafe pressure drop, sterilization compatibility, and no reusable wet path.",source:"Custom fabrication / Protolabs / local CNC",href:"https://www.protolabs.com/services/cnc-machining/"},

  {id:"valve-bank",name:"Microfluidic valve bank",type:"orderable actuator",exact:"Lee Company LHD 2-way / 3-way solenoid valve family",dims:"7 mm valve class; 2.5-4.5 g; 26-94 uL internal volume depending configuration",detail:"Switches sample, waste, and onboard calibration standard paths.",risk:"Dead volume, leakage, hold power, and cleanability determine whether it belongs in reusable or disposable path.",source:"Lee LHD valves",href:"https://www.theleeco.com/product/lhd-series-3-way-control-solenoid-valve/"},
  {id:"pressure-a",name:"Pressure sensor A",type:"orderable sensor",exact:"TE Connectivity MEAS 1620 AAMI-compliant disposable pressure sensor family",dims:"10.54 x 8.10 x 3.53 mm; -50 to 300 mmHg",detail:"Upstream pressure diagnostic for occlusion, clot, bubble, and unsafe line pressure.",risk:"Clinical path requires disposable sterile pressure interface or approved pressure transducer integration.",source:"TE MEAS 1620",href:"https://www.te.com/en/product-CAT-BLPS0030.html"},
  {id:"pressure-b",name:"Pressure sensor B",type:"orderable sensor",exact:"TE Connectivity MEAS 1620 AAMI-compliant disposable pressure sensor family",dims:"10.54 x 8.10 x 3.53 mm; -50 to 300 mmHg",detail:"Downstream pressure diagnostic and delta-pressure validation.",risk:"False pressure readings can suppress valid data or miss occlusion.",source:"TE MEAS 1620",href:"https://www.te.com/en/product-CAT-BLPS0030.html"},
  {id:"fittings",name:"1/4-28 fluidic fittings",type:"orderable fluidics",exact:"IDEX Health & Science 1/4-28 flat-bottom PEEK fittings / nuts family",dims:"Modeled as 8 mm OD x 10 mm long port bodies; real SKU dimensions vary",detail:"Connects sample, standard, waste, and dialysate tubing to the prototype cassette.",risk:"Dimensions must be locked to selected SKU before machining the cassette.",source:"IDEX 1/4-28 fittings",href:"https://idex-hs.com/store/product-detail/flangeless_fitting_natural_peek_1_4_28_flat_bottom_for_1_8_od"},

const partById = new Map(parts.map(p=>[p.id,p]));
const views = {
  assembled:{label:"Assembled",camera:[126,82,136],target:[0,10,0]},
  exploded:{label:"Exploded",camera:[150,102,164],target:[0,22,0]},
  fluidics:{label:"Fluidics",camera:[116,58,118],target:[0,0,-4]},
  chemistry:{label:"Chemistry",camera:[58,44,62],target:[0,-6,-8]},
  reader:{label:"Reader",camera:[90,68,96],target:[0,34,0]},
  validation:{label:"Validation",camera:[138,80,152],target:[2,14,10]}
};
let activeView="assembled"; let activePart="cassette";
const objectById = new Map();
const canvas=document.getElementById("canvas");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1117);
const camera=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 1000);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.62)); const key=new THREE.DirectionalLight(0xffffff,.86); key.position.set(80,110,70); scene.add(key); const fill=new THREE.DirectionalLight(0x8fd3ff,.28); fill.position.set(-80,30,-70); scene.add(fill);
const root=new THREE.Group(); scene.add(root);
function mat(hex, opacity=1, metal=.06){return new THREE.MeshStandardMaterial({color:new THREE.Color(hex),roughness:.54,metalness:metal,transparent:opacity<1,opacity,depthWrite:opacity>=.62,side:THREE.DoubleSide});}
function remember(id,obj){obj.userData.partId=id; if(!objectById.has(id)) objectById.set(id,[]); objectById.get(id).push(obj); return obj;}
function box(id,size,pos,hex,opacity=1,metal=.06){const m=remember(id,new THREE.Mesh(new THREE.BoxGeometry(...size),mat(hex,opacity,metal))); m.position.set(...pos); root.add(m); return m;}
function cyl(id,r,h,pos,hex,opacity=1,metal=.06,axis="y"){const m=remember(id,new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,80),mat(hex,opacity,metal))); if(axis==="x")m.rotation.z=Math.PI/2; if(axis==="z")m.rotation.x=Math.PI/2; m.position.set(...pos); root.add(m); return m;}
function tube(id,start,end,r,hex,opacity=.9){const mid=new THREE.Vector3((start[0]+end[0])/2,(start[1]+end[1])/2,(start[2]+end[2])/2); const dir=new THREE.Vector3(end[0]-start[0],end[1]-start[1],end[2]-start[2]); const len=dir.length(); const geom=new THREE.CylinderGeometry(r,r,len,48); const mesh=remember(id,new THREE.Mesh(geom,mat(hex,opacity,.04))); mesh.position.copy(mid); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize()); root.add(mesh); return mesh;}
function labelPlate(id,text,pos){const plate=box(id,[16,.8,5],pos,"#142029",.86); return plate;}
function setVisibilityForView(){
  const include={
    assembled:null,
    exploded:null,
    fluidics:["cassette","main-channel","flow-sensor","pump","valve-bank","pressure-a","pressure-b","fittings","stopcock","standard","waste"],
    chemistry:["cassette","main-channel","sensor-strip","k1","k2","k3","ref-a","ref-b","blank","standard"],
    reader:["reader-shell","display","afe","buffer","adc","mcu","psu","mount","pump","valve-bank"],
    validation:["cassette","main-channel","sensor-strip","k1","k2","k3","ref-a","ref-b","blank","flow-sensor","pump","valve-bank","pressure-a","pressure-b","standard","waste"]
  }[activeView];

  for(const [id,objs] of objectById) objs.forEach(o=>o.visible=include.includes(id));

function build(){
  root.clear(); objectById.clear();
  const exploded=activeView==="exploded";
  const lift = exploded ? 34 : 0;
  const cassetteY = 0;
  const top = cassetteY + 7;
  const channelY = cassetteY + 1.1;
  const stripY = top + 0.5 + lift * 0.35;
  const shellY = 36 + lift;
  const boardY = shellY + 2;
  const rearZ = -18;
  const frontZ = 18;
  const railY = 12 + lift * 0.55;
  const portY = cassetteY + 1.1;

  // Bedrail, shell, and cassette cradle: the reader physically captures the cassette from above.
  box("mount",[168,18,18],[0,shellY+42,-58],"#242d34",.92,.08);
  cyl("mount",15,34,[-78,shellY+22,-58],"#1c252c",.9,.08,"z");
  box("reader-shell",[170,42,112],[0,shellY,0],"#111820",.34,.08);
  box("reader-shell",[132,8,7],[0,railY,28],"#16232b",.72,.08);
  box("reader-shell",[132,8,7],[0,railY,-28],"#16232b",.72,.08);
  box("reader-shell",[8,12,58],[-66,railY,0],"#16232b",.72,.08);
  box("reader-shell",[8,12,58],[66,railY,0],"#16232b",.72,.08);

  // Disposable cassette is the geometric anchor. It sits between the reader rails.
  box("cassette",[120,14,44],[0,cassetteY,0],"#bfeaf4",.28,.04);
  box("main-channel",[88,4,6],[0,channelY,0],"#4ea3ff",.44,.04);
  tube("main-channel",[-44,channelY,0],[44,channelY,0],3.0,"#4ea3ff",.46);

  // End-face ports and short rigid connector bosses align with the cassette channel.
  cyl("fittings",4,12,[-66,portY,0],"#d7dde3",.95,.08,"x");
  cyl("fittings",4,12,[66,portY,0],"#d7dde3",.95,.08,"x");
  cyl("fittings",3.2,10,[-28,portY,25],"#d7dde3",.95,.08,"z");
  cyl("fittings",3.2,10,[28,portY,25],"#d7dde3",.95,.08,"z");

  // Chemistry strip is seated on the top face in the wet bay; membrane disks sit on the strip, not in free space.
  box("sensor-strip",[33.8,.5,10.2],[-4,stripY,rearZ],"#f0f2f4",.95,.05);
  cyl("k1",2.0,.45,[-17,stripY+.45,rearZ],"#36d399",1,.08);
  cyl("k2",2.0,.45,[-9,stripY+.45,rearZ],"#2fbf78",1,.08);
  cyl("k3",2.0,.45,[-1,stripY+.45,rearZ],"#70f0cb",1,.08);
  cyl("ref-a",2.0,.45,[8,stripY+.45,rearZ],"#d9eeff",1,.08);
  cyl("ref-b",2.0,.45,[16,stripY+.45,rearZ],"#8fd3ff",1,.08);
  cyl("blank",2.0,.45,[24,stripY+.45,rearZ],"#8995a1",1,.08);
  box("ref-a",[16,2,3.2],[8,stripY+2.2,rearZ-8],"#d9eeff",.75,.04);
  box("ref-b",[16,2,3.2],[16,stripY+4.4,rearZ-8],"#8fd3ff",.75,.04);

  // Pressure diaphragms are mounted on the cassette top, directly above upstream/downstream channel zones.
  box("pressure-a",[10.54,3.53,8.1],[-38,top+2.0,frontZ],"#f4f1e8",.95,.06);
  box("pressure-b",[10.54,3.53,8.1],[38,top+2.0,frontZ],"#f4f1e8",.95,.06);

  // Reader internals stay inside the transparent reader shell envelope.
  box("display",[70,4,50],[-38,shellY+23,0],"#1a2a33",.95,.08);
  box("display",[58,4.4,36],[-38,shellY+25,0],"#0b3a42",.96,.08);
  box("reader-shell",[128,1.4,78],[18,boardY-4,0],"#0c6e41",.62,.05);
  box("flow-sensor",[48,8.9,15.5],[-54,boardY,-24],"#132530",.95,.08);
  box("pump",[30,3.8,15],[-54,boardY+10,12],"#26313a",.95,.08);
  box("valve-bank",[30,9,18],[-16,boardY+8,12],"#1b242b",.96,.08);
  box("afe",[7,2,7],[26,boardY+3,-27],"#18212a",1,.1);
  box("buffer",[6,2,4.9],[38,boardY+3,-27],"#18212a",1,.1);
  box("adc",[3.5,1.2,3.5],[48,boardY+3,-27],"#18212a",1,.1);
  box("mcu",[25,3,18],[32,boardY+3,22],"#234d85",1,.08);
  box("psu",[28,9,16],[66,boardY+5,20],"#30343a",1,.08);

  // Calibration reservoirs and waste cartridge attach to the disposable cassette sidewall.
  box("standard",[18,24,10],[-42,cassetteY-1,-35],"#ffbd68",.58,.04);
  box("standard",[18,24,10],[-18,cassetteY-1,-35],"#ffbd68",.38,.04);
  box("waste",[34,28,22],[48,cassetteY-2,-35],"#dcecf2",.25,.04);
  box("stopcock",[38,12,24],[74,cassetteY+3,24],"#e6eef4",.9,.06);

  // Tubing is routed around the assembly perimeter instead of through component bodies.
  tube("fittings",[-112,portY,0],[-72,portY,0],2.1,"#dbe6e8",.9);
  tube("fittings",[72,portY,0],[112,portY,0],2.1,"#dbe6e8",.9);
  tube("flow-sensor",[-72,portY,0],[-54,boardY,-24],1.6,"#dbe6e8",.76);
  tube("flow-sensor",[-54,boardY,-24],[-66,portY,0],1.6,"#dbe6e8",.76);
  tube("standard",[-42,cassetteY-1,-35],[-28,portY,25],1.3,"#ffbd68",.72);
  tube("standard",[-18,cassetteY-1,-35],[-16,boardY+8,12],1.3,"#ffbd68",.58);
  tube("pump",[-54,boardY+10,12],[-28,portY,25],1.4,"#30d5c8",.68);
  tube("valve-bank",[-16,boardY+8,12],[28,portY,25],1.4,"#30d5c8",.68);
  tube("waste",[28,portY,25],[48,cassetteY-2,-35],1.6,"#bfeaf4",.58);
  if(activeView==="validation"){
    box("standard",[32,12,22],[-104,-18,-44],"#ffbd68",.45);
    box("waste",[44,24,28],[104,-18,-44],"#dcecf2",.22);
  }
  setVisibilityForView();
}
function setView(id){activeView=id; build(); const v=views[id]; camera.position.set(...v.camera); controls.target.set(...v.target); controls.update(); renderUI();}
function selectPart(id){activePart=id; renderUI();}
function renderUI(){
  document.getElementById("views").innerHTML=Object.entries(views).map(([id,v])=>`<button class="button ${id===activeView?"active":""}" data-view="${id}">${v.label}</button>`).join("");
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.getElementById("partList").innerHTML=parts.map(p=>`<button class="part-button ${p.id===activePart?"active":""}" data-part="${p.id}">${p.name}<span>${p.exact}</span></button>`).join("");
  document.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>selectPart(b.dataset.part));
  const p=partById.get(activePart)||parts[0];
  document.getElementById("inspector").innerHTML=`<div class="type">${p.type}</div><div class="title">${p.name}</div><p><b>Exact part / family:</b> ${p.exact}</p><p><b>Modeled dimensions:</b> ${p.dims}</p><p><b>Function:</b> ${p.detail}</p><p><b>Validation risk:</b> ${p.risk}</p><p><b>Source:</b> ${p.source}</p><a class="source-link" href="${p.href}" target="_blank" rel="noopener">Open source / order page</a>`;
  for(const [id,objs] of objectById){objs.forEach(obj=>{if(obj.material){obj.material.emissive=new THREE.Color(id===activePart?0x254b60:0x000000);obj.material.emissiveIntensity = id === activePart ? 0.55 : 0;}})}
}
const raycaster=new THREE.Raycaster(); const mouse=new THREE.Vector2();
canvas.addEventListener("click",e=>{mouse.x=e.clientX/innerWidth*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(mouse,camera); const hit=raycaster.intersectObjects(root.children,true).find(h=>h.object.userData.partId); if(hit) selectPart(hit.object.userData.partId);});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera);}
setView("assembled"); animate();
</script>
</body>
</html>
