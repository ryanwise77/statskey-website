# statskey-fleetd — state and runtime directories (FLEETD_DESIGN.md
# "Directories and ownership" and "sysusers.d / tmpfiles.d"). Applied by
# deb/postinst via `systemd-tmpfiles --create statskey-fleet.conf` and at
# every boot by systemd-tmpfiles-setup.service.
#
# Type  Path                        Mode  User           Group          Age
d       /var/lib/statskey-fleet     0700  statskey-fleet statskey-fleet -
d       /var/lib/statskey-fleetd    0700  root           root           -
d       /var/lib/statskey-fleet-jobs 0751 root           root           -
d       /run/statskey-fleetd        0750  root           statskey-fleet -
