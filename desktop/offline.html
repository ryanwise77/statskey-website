<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-statskey-offline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StatsKey</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f4f8fc;
        color: #12233d;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 8%, rgba(54, 143, 239, 0.14), transparent 32rem),
          radial-gradient(circle at 90% 92%, rgba(94, 145, 235, 0.09), transparent 28rem),
          #f4f8fc;
      }

      main {
        width: min(28rem, calc(100vw - 3rem));
        box-sizing: border-box;
        border: 1px solid rgba(28, 91, 169, 0.13);
        border-radius: 1.4rem;
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(37, 89, 151, 0.1);
        text-align: center;
      }

      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border: 1px solid rgba(0, 102, 204, 0.16);
        border-radius: 1.25rem;
        background: linear-gradient(145deg, #e2f1ff, #f3f8ff);
        color: #0066cc;
        font-size: 1.8rem;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0.75rem 0 1.5rem;
        color: #61758d;
        line-height: 1.55;
      }

      button {
        min-width: 8rem;
        padding: 0.72rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #0066cc;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(0, 102, 204, 0.2);
      }

      button:hover {
        background: #0057b8;
      }

      button:disabled {
        background: #7aa9d6;
        cursor: default;
        box-shadow: none;
      }

      .hint {
        margin: 1rem 0 0;
        font-size: 0.85rem;
        color: #8296ac;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>StatsKey couldn’t finish starting</h1>
      <p>The app view didn’t load. StatsKey keeps trying on its own, or you can try right away.</p>
      <button id="retry" type="button">Try again</button>
      <p class="hint" role="status">Retrying automatically…</p>
    </main>
    <script nonce="statskey-offline">
      var retryButton = document.getElementById('retry')
      var retryInFlight = false

      function requestRetry(manual) {
        if (retryInFlight || !window.statsKeyDesktop) return
        retryInFlight = true
        if (manual) {
          retryButton.disabled = true
          retryButton.textContent = 'Connecting…'
        }
        window.statsKeyDesktop.retry()
        // A failed retry reloads this page fresh; this reset only matters if
        // the main process could not act on the request at all.
        setTimeout(function () {
          retryInFlight = false
          if (manual) {
            retryButton.disabled = false
            retryButton.textContent = 'Try again'
          }
        }, 4000)
      }

      retryButton.addEventListener('click', function () {
        requestRetry(true)
      })
      window.addEventListener('online', function () {
        requestRetry(false)
      })
      setInterval(function () {
        requestRetry(false)
      }, 10000)
    </script>
  </body>
</html>
